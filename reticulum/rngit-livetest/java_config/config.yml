# Reticulum config for the Java rngit node under test; the stock Python
# clients connect in over loopback.
reticulum:
  enable_transport: false
  share_instance: false
  panic_on_interface_error: false
interfaces:
  "Default Interface":
    type: AutoInterface
    enabled: false
  "rngit TCP Server":
    type: TCPServerInterface
    enabled: true
    listen_ip: 127.0.0.1
    listen_port: 42508
